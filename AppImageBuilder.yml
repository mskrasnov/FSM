# appimage-builder recipe see https://appimage-builder.readthedocs.io for details
version: 1
AppDir:
  # NOTE: REPLACE THIS PATH TO CORRECT IN YOUR SYSTEM
  path: /home/misha/fsm/AppDir
  app_info:
    id: com.mskrasnov.FSM
    name: Ferrix System Monitor
    icon: com.mskrasnov.Ferrix
    version: v0.8.0
    exec: usr/bin/ferrix-app
    exec_args: $@
  files:
    include:
    - /lib64/ld-linux-x86-64.so.2
    exclude:
    - usr/share/man
    - usr/share/doc/*/README.*
    - usr/share/doc/*/changelog.*
    - usr/share/doc/*/NEWS.*
    - usr/share/doc/*/TODO.*
AppImage:
  arch: x86_64
  update-information: guess
