[workspace]
members=["ferrix-app", "ferrix-data", "ferrix-export", "ferrix-lib", "ferrix-widgets", "fxapp"]
# members=["ferrix-app", "ferrix-data", "ferrix-export", "ferrix-lib"]
resolver="2"

[workspace.package]
version = "0.7.1"
edition = "2024"
authors = ["Michail Krasnov <mskrasnov07@ya.ru>"]
license = "GPL-3.0"
repository = "https://github.com/mskrasnov/FSM"
readme = "README.md"
exclude = ["example.*", "TODO.md", "screens"]

[profile.release]
lto = true
strip = true
debug = false
panic = "abort"
opt-level = "z"
# codegen-units = 1

[workspace.dependencies]
anyhow = "1.0.98"
async-std = "1.13.2"
libc = "0.2.180"
futures = "0.3.31"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.0"
iced = { version = "0.14.0", features = ["tokio", "svg", "image", "canvas", "advanced"] }
lazy_static = "1.5.0"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "svg_backend", "line_series", "area_series"] }
plotters-iced2 = "0.14.0"
rust-embed = "8.8.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
smbios-lib = "0.9.2"
tokio = { version = "1.47.1", features = ["full"] }
toml = "0.9.8"
xml_serde = "1.4.1"
zbus = "5.9.0"
zbus_systemd = { version = "0.25701.0", features = ["systemd1", "timedate1"] }
