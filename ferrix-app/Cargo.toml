[package]
name = "ferrix-app"
description = "Simple utility to get information about hardware and software"
version = "0.6.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ferrix", "hardware", "dmi", "smbios", "linux"]
categories = ["os"]
exclude = ["assets"]

[[bin]]
name = "ferrix-app"
path = "src/bin/app.rs"

[[bin]]
name = "ferrix-polkit"
path = "src/bin/polkit.rs"

[package.metadata.deb]
maintainer = "Michail Krasnov <mskrasnov07@ya.ru>"
copyright = "2025, Michail Krasnov <mskrasnov07@ya.ru>"
license-file = ["LICENSE", "0"]
extended-description = """\
Ferrix is a program for obtaining information about computer hardware and software. It is designed to work in modern Linux OS distributions, written in Rust using iced.

Features:

1. Simple and clean user interfase;\n
2. View information about systemd services;\n
"""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/ferrix-app", "usr/bin/", "755"],
    ["target/release/ferrix-polkit", "usr/bin/", "755"],
    ["data/FSM.desktop", "usr/share/applications/", "644"],
    ["data/com.mskrasnov.Ferrix.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/com.mskrasnov.Ferrix.svg", "usr/share/Ferrix/", "644"],
    ["data/com.ferrix.policy", "/usr/share/polkit-1/actions/", "644"],
]

[dependencies]
ferrix-data = { path = "../ferrix-data", version = "0.1.0" }
ferrix-export = { path = "../ferrix-export", version = "0.1.0" }
ferrix-lib = { path = "../ferrix-lib", version = "0.4.1" }
# ferrix-widgets = { path = "../ferrix-widgets", version = "0.1.0" }

anyhow.workspace = true
async-std.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
iced.workspace = true
lazy_static.workspace = true
plotters.workspace = true
plotters-iced2.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
